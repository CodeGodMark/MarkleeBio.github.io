<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="孟謙貪吃蛇">
  <title>李孟謙 — 互動個人簡介與貪吃蛇</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --text-dim: #94a3b8;
      --danger-color: #f43f5e;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      padding: 20px 16px;
      text-align: center;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--text-dim);
    }

    .container {
      max-width: 900px;
      margin: 16px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 16px;
      align-items: start;
      width: 100%;
    }

    .panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .game-area {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    canvas {
      background: #020617;
      border: 2px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      max-width: 100%;
      height: auto;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
      touch-action: none;
    }

    .controls {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    button, select {
      background: #1e293b;
      color: var(--text-color);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    button.primary {
      background: var(--accent-color);
      color: #0f172a;
      border: none;
    }

    .info-grid {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .score-card {
      flex: 1;
      background: rgba(15, 23, 42, 0.5);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .score-title {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .score-num {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-color);
    }

    .profile-card h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
      color: var(--accent-color);
    }

    .profile-card p {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-dim);
      margin: 0;
    }

    .tag {
      display: inline-block;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent-color);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-right: 4px;
      margin-top: 6px;
    }

    /* 虛擬 D-Pad (手機觸控控制器) */
    .d-pad {
      display: none;
      grid-template-columns: repeat(3, 45px);
      grid-template-rows: repeat(3, 45px);
      gap: 6px;
      margin-top: 12px;
      justify-content: center;
    }

    .d-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: white;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    footer {
      text-align: center;
      padding: 16px;
      margin-top: auto;
      font-size: 12px;
      color: var(--text-dim);
    }

    /* 響應式佈局與手機按鈕顯示 */
    @media (max-width: 820px) {
      .container { grid-template-columns: 1fr; }
      .d-pad { display: grid; }
    }
  </style>
</head>
<body>

  <header>
    <h1>李孟謙 Meng-Chien Lee</h1>
    <p>EMS 軟體工程師 | 雲科大自動控制碩士 | C# & 工控開發</p>
  </header>

  <div class="container">
    <div class="panel game-area">
      <canvas id="gameCanvas" width="600" height="400"></canvas>

      <div class="controls">
        <button id="btnStart" class="primary">開始</button>
        <button id="btnPause">暫停</button>
        <button id="btnRestart">重來</button>
        <select id="speedSelect">
          <option value="120">慢速</option>
          <option value="90" selected>中速</option>
          <option value="60">快速</option>
        </select>
      </div>

      <div class="d-pad">
        <div></div>
        <button class="d-btn" onclick="handleTouchDir({x:0, y:-1})">▲</button>
        <div></div>
        <button class="d-btn" onclick="handleTouchDir({x:-1, y:0})">◄</button>
        <div></div>
        <button class="d-btn" onclick="handleTouchDir({x:1, y:0})">►</button>
        <div></div>
        <button class="d-btn" onclick="handleTouchDir({x:0, y:1})">▼</button>
        <div></div>
      </div>
    </div>

    <div class="panel">
      <div class="info-grid">
        <div class="score-card">
          <div class="score-title">Current Score</div>
          <div class="score-num" id="score">0</div>
        </div>
        <div class="score-card">
          <div class="score-title">Best Score</div>
          <div class="score-num" id="best">0</div>
        </div>
      </div>

      <div class="profile-card">
        <h3>關於開發者</h3>
        <p>來自台中大甲，專注於 C#、EMS系統與工業控制介面。熱衷於將機械控制邏輯與自動化軟體結合。</p>
        <div style="margin-top: 8px;">
          <span class="tag">C# / .NET</span>
          <span class="tag">自動控制</span>
          <span class="tag">工業控制</span>
          <span class="tag">羽球 / 登山</span>
        </div>
      </div>
    </div>
  </div>

  <footer>
    © 2026 李孟謙 | PWA Interactive Profile & Game
  </footer>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const CELL = 20;
    const COLS = canvas.width / CELL;
    const ROWS = canvas.height / CELL;

    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = dir;
    let food = null;
    let score = 0;
    let best = Number(localStorage.getItem('snake_best') || 0);
    let running = false;
    let paused = false;
    let gameTimer = null;
    let intervalMs = 90;

    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const btnStart = document.getElementById('btnStart');
    const btnPause = document.getElementById('btnPause');
    const btnRestart = document.getElementById('btnRestart');
    const speedSelect = document.getElementById('speedSelect');

    bestEl.textContent = best;

    function randInt(min, max) { return Math.floor(Math.random() * (max - min)) + min; }

    function placeFood() {
      while (true) {
        const x = randInt(0, COLS);
        const y = randInt(0, ROWS);
        if (!snake.some(s => s.x === x && s.y === y)) {
          food = { x, y };
          return;
        }
      }
    }

    function resetGame() {
      snake = [
        { x: Math.floor(COLS/2)-1, y: Math.floor(ROWS/2) },
        { x: Math.floor(COLS/2)-2, y: Math.floor(ROWS/2) }
      ];
      dir = { x: 1, y: 0 };
      nextDir = dir;
      score = 0;
      scoreEl.textContent = score;
      placeFood();
      running = false;
      paused = false;
      btnPause.textContent = '暫停';
    }

    function startGame() {
      if (running) return;
      running = true;
      paused = false;
      btnPause.textContent = '暫停';
      restartTimer();
    }

    function pauseGame() {
      if (!running) return;
      paused = !paused;
      btnPause.textContent = paused ? '繼續' : '暫停';
      if (paused) clearInterval(gameTimer);
      else restartTimer();
    }

    function restartTimer() {
      clearInterval(gameTimer);
      intervalMs = Number(speedSelect.value);
      gameTimer = setInterval(gameLoop, intervalMs);
    }

    function gameOver() {
      clearInterval(gameTimer);
      running = false;
      alert(`遊戲結束！獲得分數：${score}`);
      if (score > best) {
        best = score;
        localStorage.setItem('snake_best', best);
        bestEl.textContent = best;
      }
    }

    function handleTouchDir(newDir) {
      if (!running) startGame();
      if (newDir.x !== -dir.x || newDir.y !== -dir.y) nextDir = newDir;
    }

    function update() {
      if (nextDir.x !== -dir.x || nextDir.y !== -dir.y) dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS || snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (food && head.x === food.x && head.y === food.y) {
        score += 1;
        scoreEl.textContent = score;
        placeFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 食物 (發光樣式)
      if (food) {
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#f43f5e";
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.arc((food.x + 0.5) * CELL, (food.y + 0.5) * CELL, CELL / 2 - 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // 蛇身渲染
      snake.forEach((s, i) => {
        if (i === 0) {
          ctx.fillStyle = '#38bdf8';
          ctx.shadowBlur = 8;
          ctx.shadowColor = "#38bdf8";
        } else {
          ctx.fillStyle = `rgba(56, 189, 248, ${1 - i / snake.length * 0.7})`;
          ctx.shadowBlur = 0;
        }
        ctx.beginPath();
        ctx.roundRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4, 4);
        ctx.fill();
      });
    }

    function gameLoop() {
      update();
      draw();
    }

    // 鍵盤控制
    window.addEventListener('keydown', e => {
      const keys = {
        'ArrowUp': {x:0, y:-1}, 'w': {x:0, y:-1}, 'W': {x:0, y:-1},
        'ArrowDown': {x:0, y:1}, 's': {x:0, y:1}, 'S': {x:0, y:1},
        'ArrowLeft': {x:-1, y:0}, 'a': {x:-1, y:0}, 'A': {x:-1, y:0},
        'ArrowRight': {x:1, y:0}, 'd': {x:1, y:0}, 'D': {x:1, y:0}
      };
      if (keys[e.key]) handleTouchDir(keys[e.key]);
      if (e.key === ' ') pauseGame();
      if (e.key === 'Enter') startGame();
    });

    // 滑動手勢支援 (Mobile Swipe)
    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });

    canvas.addEventListener('touchend', e => {
      const diffX = e.changedTouches[0].clientX - touchStartX;
      const diffY = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (Math.abs(diffX) > 30) handleTouchDir(diffX > 0 ? {x:1, y:0} : {x:-1, y:0});
      } else {
        if (Math.abs(diffY) > 30) handleTouchDir(diffY > 0 ? {x:0, y:1} : {x:0, y:-1});
      }
    });

    // 按鈕綁定
    btnStart.addEventListener('click', startGame);
    btnPause.addEventListener('click', pauseGame);
    btnRestart.addEventListener('click', () => { resetGame(); draw(); });
    speedSelect.addEventListener('change', () => { if (running && !paused) restartTimer(); });

    resetGame();
    draw();
  </script>
</body>
</html>
